name: SCIP Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run weekly scan every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: SCIP Vulnerability & Secrets Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history scan enables SecretsEngine historical secret detection

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SCIP Security Scan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Running scoped PR scan on files changed against origin/${{ github.base_ref }}..."
            git fetch origin ${{ github.base_ref }} --depth=1
            python -m core.pipeline . \
              --sarif-out scip-results.sarif \
              --output scip-results.json \
              --exclude-tests \
              --training-path samples \
              --diff-base "origin/${{ github.base_ref }}"
          else
            echo "Running full repository scan..."
            python -m core.pipeline . \
              --sarif-out scip-results.sarif \
              --output scip-results.json \
              --exclude-tests \
              --training-path samples
          fi

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: scip-results.sarif
          category: scip-security-scanner

      - name: Archive Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scip-scan-artifacts
          path: |
            scip-results.sarif
            scip-results.json
          if-no-files-found: warn
